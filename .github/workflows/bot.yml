name: Workflow Configuration Test

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Python installation
        run: python --version

      - name: Check Python syntax without running scripts
        run: python -m compileall -q .
