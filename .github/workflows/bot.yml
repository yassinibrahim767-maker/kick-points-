name: Kick Bot Auto-Run

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

concurrency:
  group: kick-bot-group
  cancel-in-progress: false 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340 
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install camoufox recognizer requests
          
      - name: Run Bot
        env:
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          python kick_bot.py
